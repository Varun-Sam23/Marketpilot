name: MarketPilot Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Prevent stale validation runs from piling up in the Actions queue.
concurrency:
  group: marketpilot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Pin the runner image instead of relying on ubuntu-latest while its runner
    # pool is experiencing queue delays.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile app.py engine.py decision_engine.py news_intelligence.py news_agent.py watchlist_intelligence.py ai_brain.py intraday_intelligence.py sector_intelligence.py performance_intelligence.py calibration_intelligence.py institutional_flow.py options_intelligence.py pages/*.py tests/*.py
      - name: Install test dependencies
        run: python -m pip install feedparser requests google-genai
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
