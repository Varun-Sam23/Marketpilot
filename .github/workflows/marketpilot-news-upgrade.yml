name: MarketPilot News Upgrade

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-news-ui:
    if: ${{ !startsWith(github.event.head_commit.message, 'MarketPilot automated:') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add source traceability to News Intelligence
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("app.py")
          s = p.read_text(encoding="utf-8")

          old = '''rows=[]
          for item in news_intel[:20]:
              score=int(item.get("evidence_score",10)); count=int(item.get("evidence_count",0)); sources=item.get("verification_sources",[])
              rows.append({"Headline":item.get("title",""),"Verification":verification_badge(item.get("verification")),"Evidence":f'{score}/100 · {evidence_label(score)}',"Sources":count,"Impact":f'{impact_icon(item.get("impact"))} {item.get("impact","NEUTRAL")}',"Affected":item.get("affected","MARKET"),"Publisher":item.get("publisher","Unknown publisher"),"Published":item.get("published","")})
          st.dataframe(pd.DataFrame(rows),use_container_width=True,hide_index=True)
          st.markdown('<div class="mp-section">Evidence desk · top stories</div>',unsafe_allow_html=True)
          for i,item in enumerate(news_intel[:8],1):
              score=int(item.get("evidence_score",10)); sources=item.get("verification_sources",[]); source_text=" · ".join(sources) if sources else "No independent sources found"
              with st.expander(f'{i:02d} · {verification_badge(item.get("verification"))} · Evidence {score}/100 · {item.get("title","")}'):
                  st.markdown(f'<div class="news-evidence"><div class="news-evidence-title">Evidence strength · {evidence_label(score)}</div><div class="news-evidence-head">{score}/100</div><div class="news-evidence-meta"><b>Publisher:</b> {html.escape(item.get("publisher","Unknown publisher"))}<br><b>Independent sources:</b> {html.escape(source_text)}<br><b>Impact:</b> {html.escape(item.get("impact","NEUTRAL"))} · <b>Affected:</b> {html.escape(item.get("affected","MARKET"))}<br><b>Why:</b> {html.escape(item.get("verification_detail",""))}</div></div>',unsafe_allow_html=True)'''

          new = '''rows=[]
          for item in news_intel[:20]:
              score=int(item.get("evidence_score",10)); count=int(item.get("evidence_count",0)); sources=item.get("verification_sources",[])
              rows.append({"Headline":item.get("title",""),"Verification":verification_badge(item.get("verification")),"Evidence":f'{score}/100 · {evidence_label(score)}',"Sources":count,"Impact":f'{impact_icon(item.get("impact"))} {item.get("impact","NEUTRAL")}',"Affected":item.get("affected","MARKET"),"Publisher":item.get("publisher","Unknown publisher"),"Published":item.get("published","")})
          st.dataframe(pd.DataFrame(rows),use_container_width=True,hide_index=True)
          st.markdown('<div class="mp-section">Evidence desk · top stories</div>',unsafe_allow_html=True)
          for i,item in enumerate(news_intel[:8],1):
              score=int(item.get("evidence_score",10)); sources=item.get("verification_sources",[]); source_text=" · ".join(sources) if sources else "No independent sources found"; link=item.get("link","")
              published=item.get("published","") or "Publication time unavailable"
              source_link=f'<a href="{html.escape(link, quote=True)}" target="_blank" rel="noopener noreferrer">Open original report ↗</a>' if link else '<span>Original report link unavailable</span>'
              with st.expander(f'{i:02d} · {verification_badge(item.get("verification"))} · Evidence {score}/100 · {item.get("title","")}'):
                  st.markdown(f'<div class="news-evidence"><div class="news-evidence-title">Evidence strength · {evidence_label(score)}</div><div class="news-evidence-head">{score}/100</div><div class="news-evidence-meta"><b>Publisher:</b> {html.escape(item.get("publisher","Unknown publisher"))}<br><b>Independent sources:</b> {html.escape(source_text)}<br><b>Published:</b> {html.escape(published)}<br><b>Impact:</b> {html.escape(item.get("impact","NEUTRAL"))} · <b>Affected:</b> {html.escape(item.get("affected","MARKET"))}<br><b>Why:</b> {html.escape(item.get("verification_detail",""))}<br><br>{source_link}</div></div>',unsafe_allow_html=True)'''

          if old not in s:
              raise SystemExit("Target News Intelligence block not found; refusing to modify app.py")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

      - name: Commit upgrade
        shell: bash
        run: |
          git config user.name "MarketPilot Bot"
          git config user.email "marketpilot-bot@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "MarketPilot automated: add original news links"
          git push
