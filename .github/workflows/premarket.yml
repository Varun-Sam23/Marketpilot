name: MarketPilot pre-market report

on:
  schedule:
    - cron: "0 9 * * 1-5"
      timezone: "Asia/Kolkata"
  workflow_dispatch:
  push:
    paths-ignore:
      - "data/**"

permissions:
  contents: write

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  generate:
    runs-on: ubuntu-slim
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate multi-agent pre-market report
        run: python multi_agent_engine.py

      - name: Save report
        run: |
          git config user.name "marketpilot-bot"
          git config user.email "marketpilot-bot@users.noreply.github.com"
          git add data/latest.json data/history.json
          git diff --cached --quiet || git commit -m "Update multi-agent pre-market report"
          git push
