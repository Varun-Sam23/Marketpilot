name: fix-market-structure
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replace magic expression with explicit block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()
          old = '    levels=report.get("levels",{}); st.dataframe(pd.DataFrame([levels]),use_container_width=True,hide_index=True) if levels else st.caption("Technical structure will populate after the next scheduled pre-market run.")'
          new = '''    levels=report.get("levels",{})\n    if levels:\n        st.dataframe(pd.DataFrame([levels]),use_container_width=True,hide_index=True)\n    else:\n        st.caption("Technical structure will populate after the next scheduled pre-market run.")'''
          if old in s:
              p.write_text(s.replace(old, new))
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "marketpilot-bot"
          git config user.email "marketpilot-bot@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No fix needed"
            exit 0
          fi
          git commit -m "Fix Streamlit DeltaGenerator rendering"
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-market-structure.yml
          git commit -m "Remove temporary fix workflow"
          git push
