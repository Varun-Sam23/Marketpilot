name: Set ticker speed

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-ticker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set ticker speed to 180 seconds
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app.py")
          s = p.read_text(encoding="utf-8")
          s2 = s.replace("animation:mp-scroll 240s linear infinite", "animation:mp-scroll 180s linear infinite")
          if s2 == s:
              print("Ticker already set to 180s or pattern not found; no changes made.")
          else:
              p.write_text(s2, encoding="utf-8")
          PY

      - name: Commit updated app
        run: |
          git config user.name "marketpilot-bot"
          git config user.email "marketpilot-bot@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Set news ticker speed to 180 seconds"
          git push
