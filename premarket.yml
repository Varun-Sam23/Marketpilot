name: MarketPilot pre-market report

on:
  schedule:
    # 09:00 IST on weekdays. The Python engine can be extended to skip exchange holidays.
    - cron: "0 9 * * 1-5"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python engine.py
      - name: Save report
        run: |
          git config user.name "marketpilot-bot"
          git config user.email "marketpilot-bot@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "Update pre-market report"
          git push
